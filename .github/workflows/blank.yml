<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu PC Virtual</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

body {
  background:
    linear-gradient(135deg, rgba(0,0,0,.15), rgba(0,0,0,.45)),
    url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1920&q=80")
    center/cover;
}

/* ÁREA DE TRABALHO */
.desktop {
  position: absolute;
  inset: 0 0 50px 0;
  padding: 15px;
}

/* ÍCONES */
.icon {
  width: 80px;
  height: 85px;
  color: white;
  text-align: center;
  margin-bottom: 10px;
  cursor: pointer;
  border-radius: 8px;
  padding: 6px;
}

.icon:hover {
  background: rgba(255,255,255,.15);
}

.icon .emoji {
  font-size: 38px;
  display: block;
}

.icon span {
  font-size: 13px;
  text-shadow: 1px 1px 4px black;
}

/* BARRA */
.taskbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 50px;
  background: rgba(20,20,25,.88);
  backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  padding: 5px 10px;
  color: white;
  z-index: 9999;
}

.start {
  width: 42px;
  height: 40px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: white;
  font-size: 25px;
  cursor: pointer;
}

.start:hover {
  background: rgba(255,255,255,.15);
}

.clock {
  margin-left: auto;
  font-size: 13px;
  text-align: right;
}

/* MENU INICIAR */
.start-menu {
  display: none;
  position: fixed;
  bottom: 58px;
  left: 10px;
  width: 300px;
  height: 400px;
  background: rgba(25,25,30,.95);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 15px;
  padding: 18px;
  color: white;
  z-index: 10000;
  box-shadow: 0 10px 40px rgba(0,0,0,.5);
}

.start-menu h2 {
  margin-top: 0;
}

.app-button {
  width: 100%;
  padding: 13px;
  margin: 5px 0;
  background: rgba(255,255,255,.08);
  border: 0;
  border-radius: 8px;
  color: white;
  text-align: left;
  cursor: pointer;
  font-size: 15px;
}

.app-button:hover {
  background: rgba(255,255,255,.18);
}

/* JANELAS */
.window {
  display: none;
  position: absolute;
  width: min(700px, 90vw);
  height: min(500px, 70vh);
  left: 50%;
  top: 45%;
  transform: translate(-50%, -50%);
  background: #202124;
  color: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 15px 60px rgba(0,0,0,.6);
  border: 1px solid rgba(255,255,255,.15);
  z-index: 100;
}

.titlebar {
  height: 42px;
  background: #292a2d;
  display: flex;
  align-items: center;
  padding: 0 10px;
  cursor: move;
}

.title {
  flex: 1;
  font-size: 14px;
}

.close {
  width: 35px;
  height: 30px;
  border: 0;
  background: transparent;
  color: white;
  font-size: 18px;
  cursor: pointer;
  border-radius: 5px;
}

.close:hover {
  background: #d93025;
}

.content {
  padding: 20px;
  height: calc(100% - 42px);
  overflow: auto;
}

/* TERMINAL */
.terminal {
  background: #050505;
  color: #00ff66;
  height: 100%;
  padding: 15px;
  font-family: monospace;
  overflow: auto;
}

.terminal input {
  background: transparent;
  border: 0;
  outline: none;
  color: #00ff66;
  font-family: monospace;
  width: 70%;
}

/* EXPLORADOR */
.file {
  padding: 15px;
  background: #303134;
  border-radius: 8px;
  margin-bottom: 8px;
}

/* RESPONSIVO */
@media(max-width:600px) {
  .window {
    width: 94vw;
    height: 75vh;
  }

  .start-menu {
    width: 280px;
  }
}
</style>
</head>

<body>

<div class="desktop">

  <div class="icon" onclick="openWindow('explorer')">
    <div class="emoji">📁</div>
    <span>Arquivos</span>
  </div>

  <div class="icon" onclick="openWindow('browser')">
    <div class="emoji">🌐</div>
    <span>Navegador</span>
  </div>

  <div class="icon" onclick="openWindow('terminal')">
    <div class="emoji">💻</div>
    <span>Terminal</span>
  </div>

  <div class="icon" onclick="openWindow('about')">
    <div class="emoji">⚙️</div>
    <span>Configurações</span>
  </div>

</div>

<!-- MENU INICIAR -->
<div class="start-menu" id="startMenu">
  <h2>🖥️ Meu PC</h2>

  <button class="app-button" onclick="openWindow('explorer')">
    📁 Explorador de Arquivos
  </button>

  <button class="app-button" onclick="openWindow('browser')">
    🌐 Navegador
  </button>

  <button class="app-button" onclick="openWindow('terminal')">
    💻 Terminal
  </button>

  <button class="app-button" onclick="openWindow('about')">
    ⚙️ Configurações
  </button>
</div>

<!-- EXPLORADOR -->
<div class="window" id="explorer">

  <div class="titlebar">
    <div class="title">📁 Explorador de Arquivos</div>
    <button class="close" onclick="closeWindow('explorer')">×</button>
  </div>

  <div class="content">

    <div class="file">📂 Documentos</div>
    <div class="file">📂 Downloads</div>
    <div class="file">📂 Imagens</div>
    <div class="file">📂 Jogos</div>
    <div class="file">📂 Projetos</div>

  </div>
</div>

<!-- NAVEGADOR -->
<div class="window" id="browser">

  <div class="titlebar">
    <div class="title">🌐 Navegador</div>
    <button class="close" onclick="closeWindow('browser')">×</button>
  </div>

  <div class="content">

    <h2>🌐 Navegador Virtual</h2>

    <p>Digite um endereço para abrir no navegador:</p>

    <input
      id="url"
      style="width:80%;padding:12px;border-radius:8px;border:0;"
      placeholder="https://github.com"
    >

    <button
      onclick="go()"
      style="padding:12px;border:0;border-radius:8px;"
    >
      Abrir
    </button>

  </div>
</div>

<!-- TERMINAL -->
<div class="window" id="terminal">

  <div class="titlebar">
    <div class="title">💻 Terminal</div>
    <button class="close" onclick="closeWindow('terminal')">×</button>
  </div>

  <div class="terminal" id="terminalBox">

    <div>Meu PC Virtual Terminal</div>
    <div>Digite "help" para ver os comandos.</div>
    <br>

    <span>usuario@pc:~$ </span>

    <input
      id="terminalInput"
      autocomplete="off"
      onkeydown="terminalCommand(event)"
    >

  </div>
</div>

<!-- CONFIGURAÇÕES -->
<div class="window" id="about">

  <div class="titlebar">
    <div class="title">⚙️ Configurações</div>
    <button class="close" onclick="closeWindow('about')">×</button>
  </div>

  <div class="content">

    <h2>⚙️ Meu PC</h2>

    <p>Nome: Meu PC Virtual</p>
    <p>Sistema: WebOS</p>
    <p>Plataforma: GitHub Pages</p>
    <p>Dispositivo: Celular</p>

  </div>
</div>

<!-- BARRA -->
<div class="taskbar">

  <button class="start" onclick="toggleStart()">⊞</button>

  <div id="taskApps"></div>

  <div class="clock" id="clock"></div>

</div>

<script>

function openWindow(id) {

  document.getElementById(id).style.display = "block";

  document.getElementById("startMenu").style.display = "none";
}

function closeWindow(id) {

  document.getElementById(id).style.display = "none";

}

function toggleStart() {

  const menu = document.getElementById("startMenu");

  menu.style.display =
    menu.style.display === "block"
    ? "none"
    : "block";

}

function go() {

  let url = document.getElementById("url").value.trim();

  if (!url) return;

  if (!url.startsWith("http")) {
    url = "https://" + url;
  }

  window.open(url, "_blank");

}

/* RELÓGIO */

function updateClock() {

  const now = new Date();

  document.getElementById("clock").innerHTML =
    now.toLocaleDateString("pt-BR") +
    "<br>" +
    now.toLocaleTimeString("pt-BR");

}

setInterval(updateClock, 1000);

updateClock();

/* TERMINAL */

function terminalCommand(event) {

  if (event.key !== "Enter") return;

  const input = event.target;
  const command = input.value.trim().toLowerCase();

  const terminal = document.getElementById("terminalBox");

  const line = document.createElement("div");

  line.innerHTML =
    "usuario@pc:~$ " + command;

  terminal.insertBefore(line, input.parentElement);

  let response = "";

  if (command === "help") {

    response =
      "Comandos: help, clear, date, about";

  } else if (command === "date") {

    response = new Date().toString();

  } else if (command === "about") {

    response =
      "Meu PC Virtual — criado em HTML, CSS e JavaScript.";

  } else if (command === "clear") {

    terminal.innerHTML =
      '<span>usuario@pc:~$ </span>' +
      '<input id="terminalInput" autocomplete="off" onkeydown="terminalCommand(event)">';

    return;

  } else if (command === "") {

    response = "";

  } else {

    response =
      "Comando não encontrado. Digite help.";

  }

  if (response) {

    const result = document.createElement("div");

    result.textContent = response;

    terminal.insertBefore(
      result,
      input.parentElement
    );

  }

  input.value = "";

}

/* JANELAS ARRASTÁVEIS */

document.querySelectorAll(".window").forEach(win => {

  const bar = win.querySelector(".titlebar");

  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  bar.addEventListener("mousedown", start);
  bar.addEventListener("touchstart", start, {passive:false});

  function start(e) {

    dragging = true;

    const p = e.touches ? e.touches[0] : e;

    const rect = win.getBoundingClientRect();

    offsetX = p.clientX - rect.left;
    offsetY = p.clientY - rect.top;

    e.preventDefault();

  }

  document.addEventListener("mousemove", move);
  document.addEventListener("touchmove", move, {passive:false});

  function move(e) {

    if (!dragging) return;

    const p = e.touches ? e.touches[0] : e;

    win.style.left =
      (p.clientX - offsetX) + "px";

    win.style.top =
      (p.clientY - offsetY) + "px";

    win.style.transform = "none";

    e.preventDefault();

  }

  document.addEventListener("mouseup", stop);
  document.addEventListener("touchend", stop);

  function stop() {
    dragging = false;
  }

});

</script>

</body>
</html>
